plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

// Release notes of one version: the CHANGELOG.md section from its "## <version>" heading up to the next "## " heading.
// CHANGELOG.md is wrapped at 120 columns; GitHub releases would show every line break, so wrapped lines are joined:
// a line continues the one before unless it is blank, a heading or a new list item.
ext.changelogFor = { String v ->
    def lines = rootProject.file('CHANGELOG.md').readLines('UTF-8')
    def heading = ~/^## ${java.util.regex.Pattern.quote(v)}(\s.*)?$/
    def start = lines.findIndexOf { heading.matcher(it).matches() }
    if (start < 0) {
        throw new GradleException("CHANGELOG.md has no '## ${v}' section")
    }
    def end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
    def startsBlock = { String line -> line.isBlank() || line.startsWith('#') || line ==~ /^\s*([-*]|\d+\.)\s.*/ }
    def out = []
    lines.subList(start + 1, end < 0 ? lines.size() : end).each { line ->
        if (!startsBlock(line) && out && !out.last().isBlank() && !out.last().startsWith('#')) {
            out[-1] = out.last() + ' ' + line.trim()
        } else {
            out << line
        }
    }
    out.join('\n').trim()
}

// Modrinth version type from the version: 1.2.3-alpha.1 is an alpha, 1.2.3-beta.1 or -rc.1 a beta, the rest releases.
ext.modrinthVersionType = { String v ->
    v.contains('-alpha') ? 'alpha' : (v.contains('-beta') || v.contains('-rc')) ? 'beta' : 'release'
}

// Writes the release notes of mod_version to build/release-notes.md (the body of the GitHub release).
tasks.register('releaseNotes') {
    def out = layout.buildDirectory.file('release-notes.md')
    def notes = changelogFor(project.mod_version)
    inputs.property('notes', notes)
    outputs.file(out)
    doLast {
        out.get().asFile.setText(notes + '\n', 'UTF-8')
    }
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }

        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }

        maven {
            name = "DevAuth"
            url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
        }

        maven {
            name = "Flemmli97"
            url = "https://maven.blazing-coop.net/releases"
        }
    }
}


subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    dependencies {
        // Minecraft 26.1+ is unobfuscated, no mappings are needed anymore.
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"

        // Netty comes from Minecraft, as in the shipped jars (which leave io/netty out). HiveMQ's own Netty 4.1
        // netty-codec would otherwise shadow Minecraft's 4.2 netty-codec-base and break WebSocket connections in dev.
        implementation('com.hivemq:hivemq-mqtt-client:1.3.7') {
            exclude group: 'io.netty'
        }

        if (project.name in ['fabric', 'neoforge']) {
            runtimeOnly("me.djtheredstoner:DevAuth-${project.name}:1.2.2")
        }
    }

    if (project.name in ['fabric', 'neoforge']) {
        loom.runs {
            configureEach {
                generateRunConfig.set(true)
                appendProjectPathToDisplayName.set(false)
                ideConfigFolder.set(project.name == 'fabric' ? 'Fabric' : 'NeoForge')
            }

            def standardClient = getByName('client')
            standardClient.displayName.set("Client:${project.name}")
            standardClient.systemProperties.put('devauth.enabled', 'false')

            named('server') {
                displayName.set("Server:${project.name}")
                systemProperties.put('devauth.enabled', 'false')
            }

            register('clientDevMain') {
                inherit(standardClient)
                displayName.set("Client:${project.name}:Main")
                systemProperties.put('devauth.enabled', 'true')
                systemProperties.put('devauth.account', 'main')
            }

            register('clientDevAlt') {
                inherit(standardClient)
                displayName.set("Client:${project.name}:Alt")
                systemProperties.put('devauth.enabled', 'true')
                systemProperties.put('devauth.account', 'alt')
            }
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25

        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 25
        it.options.compilerArgs += ['-Xmaxerrs', '2000']
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        zip64 = true
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
