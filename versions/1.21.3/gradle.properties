# Minecraft 1.21.3 node. Covers 1.21.2 and 1.21.3 (Architectury 14.x).
# Newest stable dependency versions as of 2026-10-15.
minecraft_version=1.21.3
java_version=21
architectury_api_version=14.0.4
fabric_api_version=0.114.1+1.21.3
neoforge_version=21.3.97
modmenu_version=12.0.1
cloth_config_version=16.0.143
# Flan has no 1.21.2/1.21.3 build; its API is compile-only in common and the same as on 1.21.4.
# Flan's Maven version prefix: <Minecraft>-<Flan>.
flan_version=1.21.4-1.11.7.b
# Versions the jars declare. The node is built and boot-tested on minecraft_version only.
minecraft_range_fabric=>=1.21.2 <1.21.4
minecraft_range_neoforge=[1.21.2,1.21.4)
neoforge_range=[21.2,)
# The Minecraft versions Modrinth and CurseForge list for the jars.
game_versions=1.21.2,1.21.3
