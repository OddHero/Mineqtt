# Minecraft 26.1.2 node. Covers 26.1.2 only: Architectury 20.1.x requires 26.1.2, so 26.1 and 26.1.1 are not covered.
# Newest stable dependency versions as of 2026-10-15.
minecraft_version=26.1.2
java_version=25
architectury_api_version=20.1.17
fabric_api_version=0.155.3+26.1.2
neoforge_version=26.1.2.116
modmenu_version=18.0.2
cloth_config_version=26.1.154
# Flan's Maven version prefix: <Minecraft>-<Flan>.
flan_version=26.1.2-1.12.8
# Versions the jars declare. The node is built and boot-tested on minecraft_version only.
minecraft_range_fabric=>=26.1.2 <26.2
minecraft_range_neoforge=[26.1.2,26.2)
neoforge_range=[26.1.2,)
# The Minecraft versions Modrinth and CurseForge list for the jars.
game_versions=26.1.2
