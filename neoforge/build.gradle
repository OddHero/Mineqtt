apply from: rootProject.file('gradle/shared.gradle')
apply plugin: 'com.modrinth.minotaur'

architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"
    // modImplementation on obfuscated versions, implementation on unobfuscated ones (see gradle/shared.gradle).
    add(project.modImplementation, "dev.architectury:architectury-neoforge:$project.architectury_api_version")

    add(project.modCompileOnly, "io.github.flemmli97:flan:${project.flan_version}-neoforge:api") { transitive = false }
    // Flan in the dev runs only where it is published for this very Minecraft version.
    if ((project.flan_version as String).startsWith("${project.minecraft_version}-")) {
        add(project.modRuntimeOnly, "io.github.flemmli97:flan:${project.flan_version}-neoforge") { transitive = false }
    }

    common(commonNamed(commonNode)) { transitive false }
    shadowBundle project(path: commonNode, configuration: 'transformProductionNeoForge')

    forgeRuntimeLibrary("com.hivemq:hivemq-mqtt-client:$rootProject.hivemq_version") {
        exclude group: 'io.netty'
    }
    // The HiveMQ MQTT client is bundled (relocated, without Netty).
    shadowBundle("com.hivemq:hivemq-mqtt-client:$rootProject.hivemq_version")
}

processResources {
    def props = [
            version                 : project.version,
            minecraft_range         : project.minecraft_range_neoforge,
            neoforge_range          : project.neoforge_range,
            architectury_api_version: project.architectury_api_version,
    ]
    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    archiveClassifier = 'raw'
}

configureReleaseShadow(tasks.named('shadowJar'))

modrinth {
    // MODRINTH_TOKEN must be set (the release workflow passes the repository secret); keep it private.
    // MODRINTH_DEBUG=true prints the upload instead of sending it.
    token = System.getenv("MODRINTH_TOKEN")
    debugMode = System.getenv("MODRINTH_DEBUG") == "true"
    projectId = "mineqtt"
    versionNumber = project.version.toString()
    versionName = "MineQTT ${rootProject.mod_version} for Minecraft ${project.minecraft_version} (NeoForge)"
    versionType = rootProject.modrinthVersionType(rootProject.mod_version.toString())
    changelog = rootProject.changelogFor(rootProject.mod_version.toString())
    uploadFile = releaseJarTask
    gameVersions = (project.game_versions as String).split(',') as List
    loaders = ["neoforge"]
    dependencies {
        required.project "architectury-api"
        optional.project "flan"
    }
}
