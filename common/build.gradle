apply from: rootProject.file('gradle/shared.gradle')

architectury {
    common rootProject.enabled_platforms.split(',')
}

// The branch folder (common/) with the sources and resources of every version; this node's folder is common/versions/<mc>.
def branchDir = project.parent.projectDir

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    add(project.modImplementation, "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")

    add(project.modImplementation, "dev.architectury:architectury:$project.architectury_api_version")

    // Common Cloth Config dependency
    add(project.modCompileOnly, "me.shedaniel.cloth:cloth-config:$project.cloth_config_version")

    // Common Flan API dependency
    add(project.modCompileOnly, "io.github.flemmli97:flan:${project.flan_version}-common:api") { transitive = false }
}

// Keep the executable regression harness separate from framework-based unit tests.
sourceSets {
    sensorChecks {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Minecraft-free checks of mqtt.core against a real broker. The classpath deliberately skips main's
    // dependencies: Minecraft's Netty 4.2 must not replace the 4.1 line that HiveMQ and Moquette are built for.
    brokerChecks {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    brokerChecksImplementation "com.hivemq:hivemq-mqtt-client:$rootProject.hivemq_version"
    // Test-only in-process broker. Only the brokerChecks configurations see it, so it never reaches a shadowBundle.
    brokerChecksImplementation 'io.moquette:moquette-broker:0.17'
    // Must match the Gson that Minecraft 26.2 ships, which main gets from Minecraft itself.
    brokerChecksImplementation 'com.google.code.gson:gson:2.14.0'
}

// Bootstrap real Minecraft blocks to verify MQTT payloads without a broker or running game.
tasks.register('verifyBlockSensor', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.blocks.entities.BlockSensorPayloadTest'
}
tasks.register('verifyBlockEmitter', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.blocks.entities.BlockEmitterPayloadTest'
}
// The v1 timers' HH:MM conversions, presets and pulses, as the timer devices keep them (M4 plan D2).
tasks.register('verifyAlarmClock', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.timer.AlarmClockCheck'
}
tasks.register('verifyGameTimeTimer', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.timer.GameTimeTimerCheck'
}
// The timers (M4 plan D2, bootstrapped): the schedules tick by tick, pulses and manual triggers, next fires, status lines
// and the four device types.
tasks.register('verifyTimers', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.timer.TimersCheck'
}
// Consent and presence (M4 plan D9, D10, bootstrapped): the consent matrix, the first-join prompt once, the privacy choices and
// the prompt's buttons, what /mineqtt privacy reports, the player entries the registry keeps.
tasks.register('verifyPrivacy', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.presence.PrivacyCheck'
}
// Rooms (M4 plan D11, bootstrapped for the codecs): corners, names, sizes and counts, which room a device is in, the
// devices an edit touches, a group's common room and how commands name a room.
tasks.register('verifyRooms', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.rooms.RoomsCheck'
}
// Config v2 defaults, v1 migration, the JSON form and credential masking; plain Java, no game bootstrap needed.
tasks.register('verifyConfigMigration', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.config.ConfigMigrationCheck'
    // NeoForge parity (M4 plan D16): the check reads the NeoForge config source as text, since it cannot load it.
    def neoForgeConfigSource = rootProject.file('neoforge/src/main/java/art/rehra/mineqtt/neoforge/config/NeoForgeConfigHandler.java')
    inputs.file(neoForgeConfigSource).withPropertyName('neoForgeConfigSource')
    systemProperty 'mineqtt.neoForgeConfigSource', neoForgeConfigSource.absolutePath
}
// Bridge id generation, bridge topics, how the runtime's MQTT service survives a reconnect, the default wiring's order over the
// device types (bootstrapped, M4 plan D15) and the day clock.
tasks.register('verifyRuntimeWiring', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.runtime.RuntimeWiringCheck'
}
// The device registry file: read back twice, backup fallback, quarantine of unreadable files, bad entries, the wire codec.
tasks.register('verifyRegistryRoundTrip', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.RegistryStoreTest'
}
