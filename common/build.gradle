tasks.register('verifyRawLinkRetain', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.RawLinkRetainCheck'
}
// v1 block entity data and topic states: snapshots, the Smart Lamp's, the Redstone Output's and Input's and the Presence Sensor's v2 data, adopted Raw Links, records and legacy groups.
tasks.register('verifyLegacyNbtMigration', JavaExec) {
