architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Common Cloth Config dependency
    compileOnly("me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}")

    // Common Flan API dependency
    compileOnly "io.github.flemmli97:flan:${minecraft_version}-${flan_version}-common:api"
}

// Keep the executable regression harness separate from framework-based unit tests.
sourceSets {
    sensorChecks {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// Bootstrap real Minecraft blocks to verify MQTT payloads without a broker or running game.
tasks.register('verifyBlockSensor', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.blocks.entities.BlockSensorPayloadTest'
}
tasks.register('verifyBlockEmitter', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.blocks.entities.BlockEmitterPayloadTest'
}
tasks.register('verifyAlarmClock', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.blocks.entities.AlarmClockBlockEntityTest'
}
tasks.named('check') {
    dependsOn tasks.named('verifyBlockSensor')
    dependsOn tasks.named('verifyBlockEmitter')
    dependsOn tasks.named('verifyAlarmClock')
}
