architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Common Cloth Config dependency
    compileOnly("me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}")

    // Common Flan API dependency
    compileOnly "io.github.flemmli97:flan:${minecraft_version}-${flan_version}-common:api"
}

// Keep the executable regression harness separate from framework-based unit tests.
sourceSets {
    sensorChecks {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Minecraft-free checks of mqtt.core against a real broker. The classpath deliberately skips main's
    // dependencies: Minecraft's Netty 4.2 must not replace the 4.1 line that HiveMQ and Moquette are built for.
    brokerChecks {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    brokerChecksImplementation 'com.hivemq:hivemq-mqtt-client:1.3.7'
    // Test-only in-process broker. Only the brokerChecks configurations see it, so it never reaches a shadowBundle.
    brokerChecksImplementation 'io.moquette:moquette-broker:0.17'
    // Must match the Gson that Minecraft 26.2 ships, which main gets from Minecraft itself.
    brokerChecksImplementation 'com.google.code.gson:gson:2.14.0'
}

// Bootstrap real Minecraft blocks to verify MQTT payloads without a broker or running game.
tasks.register('verifyBlockSensor', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.blocks.entities.BlockSensorPayloadTest'
}
tasks.register('verifyBlockEmitter', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.blocks.entities.BlockEmitterPayloadTest'
}
tasks.register('verifyAlarmClock', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.blocks.entities.AlarmClockBlockEntityTest'
}
tasks.register('verifyGameTimeTimer', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.blocks.entities.GameTimeTimerBlockEntityTest'
}
// Config v2 defaults, v1 migration, the JSON form and credential masking; plain Java, no game bootstrap needed.
tasks.register('verifyConfigMigration', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.config.ConfigMigrationCheck'
}
// Bridge id generation, bridge topics and how the runtime's MQTT service survives a reconnect; no game bootstrap needed.
tasks.register('verifyRuntimeWiring', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.runtime.RuntimeWiringCheck'
}
// The device registry file: read back twice, backup fallback, quarantine of unreadable files, bad entries, the wire codec.
tasks.register('verifyRegistryRoundTrip', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.RegistryStoreTest'
}
// Raw grammar, HA light merge, colours, lenient field codecs, Locale.ROOT numbers and device type declarations.
tasks.register('verifyValueCodecs', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.ValueCodecsTest'
}
// Server-only lifecycle predicates, the placement sanitiser, the mineqtt compound, the command routing table and the per-type publish limits.
tasks.register('verifyLifecycleGuards', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.LifecycleGuardTest'
}
// Token buckets and rate limits, the C2S guard's order, field caps, the device access table, who may change the access mode and claim a device, what Diagnostics shows of a device's traffic to whom, the owner match by UUID and the ownerUuid key, who may expose devices, the Bridge Console's access and list scoping and the slots' closed automation faces (bootstrapped).
tasks.register('verifySecurityGuards', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.security.SecurityGuardsCheck'
}
// Device declarations (bootstrapped): ports derived and frozen, HA events and commands declared, strict settings and link
// settings, which port pairs a wire may join and the device view's stream codec and 32 KiB cap.
tasks.register('verifyDeviceTypes', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.DeviceTypesCheck'
}
// The generated device screen (bootstrapped): tabs and controls derived per type, the permission of each control and the
// bounds of what it sends, as the server's validator checks them; the General tab's slug preview, the Access tab's mode, who may claim and retry, the Diagnostics tab's ages.
tasks.register('verifyDeviceTabs', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.ui.device.DeviceTabsCheck'
}
// Item and paper topics: the shared namespace, the allowlist, owner literal sets, refusals and the M1 re-resolution; no game bootstrap needed.
tasks.register('verifyRawTopics', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.RawTopicsCheck'
}
// Wireless redstone is retained: the retain override and type defaults, M1 and v1 links, empty payloads and what an output leaves on its topic.
tasks.register('verifyRawLinkRetain', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.device.RawLinkRetainCheck'
}
// v1 block entity data and topic states: snapshots, the Smart Lamp's, the Redstone Output's and Input's and the Presence Sensor's v2 data, adopted Raw Links, records and legacy groups.
tasks.register('verifyLegacyNbtMigration', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.legacy.LegacyNbtV1Test'
}
// Home Assistant discovery payloads: the bridge, the Smart Lamp, the Redstone Output and Input and the Presence Sensor against golden files, the §4.1 example, every entity kind.
tasks.register('verifyDiscoveryPayloads', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.ha.DiscoveryGoldenTest'
}
// Discovery publishing: exposure and hashes, the rate limit, the v1 migration and status clear, birth and bridge requests,
// the ghost cleanup.
tasks.register('verifyDiscoveryPublisher', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.ha.DiscoveryPublisherCheck'
}
// The Catalog of blocks and items: assets, loot tables, lang keys, 26.2 recipes behind the Network Chip and their unlock
// advancements (bootstrapped). It reads the source resources, so a deleted file cannot survive in build/resources.
tasks.register('verifyCatalog', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.registry.CatalogCheck'
    def resourcesDir = file('src/main/resources')
    inputs.dir(resourcesDir).withPropertyName('resources')
    args resourcesDir.absolutePath
}

// Run mqtt.core checks against an in-process Moquette broker; the timeout keeps a stuck broker from hanging check.
tasks.register('verifyBrokerSmoke', JavaExec) {
    dependsOn brokerChecksClasses
    classpath = sourceSets.brokerChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.mqtt.core.BrokerSmokeCheck'
    timeout = java.time.Duration.ofMinutes(2)
}

// Minecraft-free unit checks of mqtt.core; they need no broker but share the isolated classpath.
[
        verifyTopicTrie     : 'TopicTrieCheck',
        verifyBrokerUri     : 'BrokerUriCheck',
        verifyInboundQueue  : 'InboundQueueCheck',
        verifyOutboundBuffer: 'OutboundBufferCheck',
        verifyTopicAcl      : 'TopicAclCheck',
].each { taskName, checkClass ->
    tasks.register(taskName, JavaExec) {
        dependsOn brokerChecksClasses
        classpath = sourceSets.brokerChecks.runtimeClasspath
        mainClass = "art.rehra.mineqtt.mqtt.core.${checkClass}"
        timeout = java.time.Duration.ofMinutes(2)
    }
}

// The flows message bus and its coercion table, Minecraft-free on the same isolated classpath: FIFO order, the hop TTL,
// fan-in, the drain budget, the rate cap, the change filter, wire mappings and payload caps.
tasks.register('verifyMessageBus', JavaExec) {
    dependsOn brokerChecksClasses
    classpath = sourceSets.brokerChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.flow.core.MessageBusCheck'
    timeout = java.time.Duration.ofMinutes(2)
}

// HiveMqttService scenarios behind a TCP proxy: MQTT 3.1.1 against Moquette by default, both protocols against
// -PexternalBroker=tcp://host:port (the Docker Mosquitto, E2E item 13), since Moquette refuses MQTT 5.
tasks.register('verifyBrokerIntegration', JavaExec) {
    dependsOn brokerChecksClasses
    classpath = sourceSets.brokerChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.mqtt.core.BrokerIntegrationCheck'
    def externalBroker = providers.gradleProperty('externalBroker')
    argumentProviders.add({ externalBroker.isPresent() ? [externalBroker.get()] : [] } as CommandLineArgumentProvider)
    timeout = java.time.Duration.ofMinutes(5)
}

// The Minecraft-free cores stay testable without Minecraft (M2 plan §3.8 #7). Each scope is an allowlist of packages and
// classes, since main's compile classpath also carries Netty 4.2, Guava, fastutil, slf4j and the loaders, which brokerChecks lacks:
// - mqtt.core: the JDK, Gson, HiveMQ and itself; its checks also the embedded Moquette broker and ha.GhostCleanup
// - flow.core (port kinds, coercion, wires and the message bus): the JDK, Gson, itself and security.TokenBucket
// - security/TokenBucket.java and RateLimit.java, which flow.core and the server share: the JDK only, and none of the
//   other classes of their package, which they could name without an import
// - ha/GhostCleanup.java, which the broker integration check runs against a real broker: what mqtt.core may use plus
//   mqtt.core, and none of the other classes of its package
tasks.register('verifyCoreIsolation') {
    group = 'verification'
    description = 'Fails if a source of mqtt.core, flow.core, TokenBucket, RateLimit or GhostCleanup references a package or class outside its allowlist.'
    def jdk = ['java', 'javax']
    def mqttAllowed = jdk + ['com.google.gson', 'com.hivemq.client', 'art.rehra.mineqtt.mqtt.core']
    def flowAllowed = jdk + ['com.google.gson', 'art.rehra.mineqtt.flow.core', 'art.rehra.mineqtt.security.TokenBucket']
    def securityDir = file('src/main/java/art/rehra/mineqtt/security')
    def haDir = file('src/main/java/art/rehra/mineqtt/ha')
    // A scope of single classes names the folder of their package third: its files must exist, and the other classes there are off limits.
    def scopes = [
            'mqtt.core'        : [fileTree('src/main/java/art/rehra/mineqtt/mqtt/core') { include '**/*.java' }, mqttAllowed],
            'mqtt.core checks' : [fileTree('src/brokerChecks/java/art/rehra/mineqtt/mqtt/core') { include '**/*.java' },
                                  mqttAllowed + ['io.moquette', 'art.rehra.mineqtt.ha.GhostCleanup']],
            'flow.core'        : [fileTree('src/main/java/art/rehra/mineqtt/flow/core') { include '**/*.java' }, flowAllowed],
            'flow.core checks' : [fileTree('src/brokerChecks/java/art/rehra/mineqtt/flow/core') { include '**/*.java' }, flowAllowed],
            'rate limits'      : [files(new File(securityDir, 'TokenBucket.java'), new File(securityDir, 'RateLimit.java')), jdk, securityDir],
            'ghost cleanup'    : [files(new File(haDir, 'GhostCleanup.java')), mqttAllowed, haDir],
    ]
    def baseDir = projectDir
    scopes.each { name, scope -> inputs.files(scope[0]).withPropertyName(name.replaceAll(/\W/, '_')) }
    inputs.files(fileTree(securityDir) { include '*.java' }).withPropertyName('securityPackage')
    inputs.files(fileTree(haDir) { include '*.java' }).withPropertyName('haPackage')
    doLast {
        // Comments and string literals are blanked (keeping newlines) so only code matches and line numbers stay exact.
        def nonCode = ~/(?s)""".*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])+'|\/\/[^\n]*|\/\*.*?\*\//
        // A qualified name: two or more lowercase segments (the package), then a type or a wildcard. This catches
        // imports, static imports and fully qualified references alike, and lets an allowlist name a single class.
        // A field chain ending in a constant (a.b.CONST) also matches.
        def qualifiedName = ~/(?<![\w.])([a-z_][a-z0-9_]*(?:\.[a-z_][a-z0-9_]*)+)\.([A-Z][\w$]*|\*)/
        def violations = []
        def relative = { File source -> baseDir.toPath().relativize(source.toPath()) }
        scopes.each { name, scope ->
            def (sources, allowed, packageDir) = scope
            // The other classes of a single class's package need no import, so they are matched by their simple names.
            def siblingName = null
            if (packageDir != null) {
                def own = sources.files*.name
                sources.files.findAll { !it.isFile() }.each { violations << "${relative(it)}: missing, so ${name} checks nothing there" }
                def siblings = packageDir.listFiles().findAll { it.name.endsWith('.java') && !own.contains(it.name) }.collect { it.name - '.java' }
                if (!siblings.isEmpty()) siblingName = ~/(?<![\w.$])(${siblings.join('|')})(?![\w$])/
            }
            sources.files.findAll { it.isFile() }.sort().each { File source ->
                def code = source.getText('UTF-8').replaceAll(nonCode) { String literal -> literal.replaceAll(/[^\n]/, ' ') }
                def report = { int offset, String rule ->
                    def line = code.substring(0, offset).count('\n') + 1
                    violations << "${relative(source)}:${line} (${name} ${rule}): ${source.readLines('UTF-8')[line - 1].trim()}"
                }
                def matcher = qualifiedName.matcher(code)
                while (matcher.find()) {
                    def qualified = matcher.group(1) + '.' + matcher.group(2)
                    if (!allowed.any { qualified == it || qualified.startsWith(it + '.') }) report(matcher.start(), "may only use ${allowed.join(', ')}")
                }
                if (siblingName != null) {
                    def sibling = siblingName.matcher(code)
                    while (sibling.find()) report(sibling.start(), "may not use ${sibling.group(1)}, another class of its package")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("A Minecraft-free core references something outside its allowlist:\n" + violations.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBlockSensor')
    dependsOn tasks.named('verifyBlockEmitter')
    dependsOn tasks.named('verifyAlarmClock')
    dependsOn tasks.named('verifyGameTimeTimer')
    dependsOn tasks.named('verifyConfigMigration')
    dependsOn tasks.named('verifyRuntimeWiring')
    dependsOn tasks.named('verifyRegistryRoundTrip')
    dependsOn tasks.named('verifyValueCodecs')
    dependsOn tasks.named('verifyLifecycleGuards')
    dependsOn tasks.named('verifyDeviceTypes')
    dependsOn tasks.named('verifyDeviceTabs')
    dependsOn tasks.named('verifySecurityGuards')
    dependsOn tasks.named('verifyRawTopics')
    dependsOn tasks.named('verifyRawLinkRetain')
    dependsOn tasks.named('verifyLegacyNbtMigration')
    dependsOn tasks.named('verifyDiscoveryPayloads')
    dependsOn tasks.named('verifyDiscoveryPublisher')
    dependsOn tasks.named('verifyCatalog')
    dependsOn tasks.named('verifyBrokerSmoke')
    dependsOn tasks.named('verifyTopicTrie')
    dependsOn tasks.named('verifyBrokerUri')
    dependsOn tasks.named('verifyInboundQueue')
    dependsOn tasks.named('verifyOutboundBuffer')
    dependsOn tasks.named('verifyTopicAcl')
    dependsOn tasks.named('verifyBrokerIntegration')
    dependsOn tasks.named('verifyMessageBus')
    dependsOn tasks.named('verifyCoreIsolation')
}
