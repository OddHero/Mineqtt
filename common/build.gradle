    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.legacy.LegacyNbtV1Test'
}
// Home Assistant discovery payloads: the bridge, the Smart Lamp, the Redstone Output and Input and the Presence Sensor against golden files, the §4.1 example, every entity kind.
tasks.register('verifyDiscoveryPayloads', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.ha.DiscoveryGoldenTest'
}
// Discovery publishing: exposure and hashes, the rate limit, the v1 migration and status clear, birth and bridge requests,
