    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.ui.device.DeviceTabsCheck'
}
// Item and paper topics: the shared namespace, the allowlist, owner literal sets, refusals and the M1 re-resolution; no game bootstrap needed.
tasks.register('verifyRawTopics', JavaExec) {
