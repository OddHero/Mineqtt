tasks.register('verifyDiscoveryPublisher', JavaExec) {
    dependsOn sensorChecksClasses
    classpath = sourceSets.sensorChecks.runtimeClasspath
    mainClass = 'art.rehra.mineqtt.ha.DiscoveryPublisherCheck'
}
// Incoming state never becomes a request (M3 plan D10, bootstrapped): the mirror route table, reading a synthetic twin type,
