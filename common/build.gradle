// The Minecraft-free cores stay testable without Minecraft (M2 plan §3.8 #7). Each scope is an allowlist of packages and
// classes, since main's compile classpath also carries Netty 4.2, Guava, fastutil, slf4j and the loaders, which brokerChecks lacks:
// - mqtt.core: the JDK, Gson, HiveMQ and itself; its checks also the embedded Moquette broker and ha.GhostCleanup
// - flow.core (port kinds, coercion, wires and the message bus): the JDK, Gson, itself and security.TokenBucket
// - twin.core (the statestream parser, entity documents, the catalog, value paths and maps, the panel layout, HA
//   domains and the service-call table) and its checks: the JDK, Gson, flow.core and itself
// - security/TokenBucket.java and RateLimit.java, which flow.core and the server share: the JDK only, and none of the
//   other classes of their package, which they could name without an import
// - ha/GhostCleanup.java, which the broker integration check runs against a real broker: what mqtt.core may use plus
//   mqtt.core, and none of the other classes of its package
tasks.register('verifyCoreIsolation') {
    group = 'verification'
    description = 'Fails if a source of mqtt.core, flow.core, twin.core, device.timer.core, telemetry.core, TokenBucket, RateLimit, GhostCleanup, GameClock or CronSchedule references a package or class outside its allowlist.'
    def jdk = ['java', 'javax']
    def mqttAllowed = jdk + ['com.google.gson', 'com.hivemq.client', 'art.rehra.mineqtt.mqtt.core']
    def flowAllowed = jdk + ['com.google.gson', 'art.rehra.mineqtt.flow.core', 'art.rehra.mineqtt.security.TokenBucket']
    def twinAllowed = jdk + ['com.google.gson', 'art.rehra.mineqtt.flow.core', 'art.rehra.mineqtt.twin.core']
    // The M4 cores (M4 plan D2, D6): the timers' schedules and the world telemetry, on the JDK, Gson, the day clock, the
    // cron grammar and the rate limits only.
    def m4CoreAllowed = jdk + ['com.google.gson', 'art.rehra.mineqtt.util.GameClock', 'art.rehra.mineqtt.util.CronSchedule',
                               'art.rehra.mineqtt.security.TokenBucket', 'art.rehra.mineqtt.security.RateLimit']
    def timerAllowed = m4CoreAllowed + ['art.rehra.mineqtt.device.timer.core']
    def telemetryAllowed = m4CoreAllowed + ['art.rehra.mineqtt.telemetry.core']
    def securityDir = new File(branchDir, 'src/main/java/art/rehra/mineqtt/security')
    def haDir = new File(branchDir, 'src/main/java/art/rehra/mineqtt/ha')
    def utilDir = new File(branchDir, 'src/main/java/art/rehra/mineqtt/util')
    // A scope of single classes names the folder of their package third: its files must exist, and the other classes there are off limits.
    def scopes = [
            'mqtt.core'        : [fileTree(new File(branchDir, 'src/main/java/art/rehra/mineqtt/mqtt/core')) { include '**/*.java' }, mqttAllowed],
            'mqtt.core checks' : [fileTree(new File(branchDir, 'src/brokerChecks/java/art/rehra/mineqtt/mqtt/core')) { include '**/*.java' },
                                  mqttAllowed + ['io.moquette', 'art.rehra.mineqtt.ha.GhostCleanup']],
            'flow.core'        : [fileTree(new File(branchDir, 'src/main/java/art/rehra/mineqtt/flow/core')) { include '**/*.java' }, flowAllowed],
            'flow.core checks' : [fileTree(new File(branchDir, 'src/brokerChecks/java/art/rehra/mineqtt/flow/core')) { include '**/*.java' }, flowAllowed],
            'twin.core'        : [fileTree(new File(branchDir, 'src/main/java/art/rehra/mineqtt/twin/core')) { include '**/*.java' }, twinAllowed],
            'twin.core checks' : [fileTree(new File(branchDir, 'src/brokerChecks/java/art/rehra/mineqtt/twin/core')) { include '**/*.java' }, twinAllowed],
            'rate limits'      : [files(new File(securityDir, 'TokenBucket.java'), new File(securityDir, 'RateLimit.java')), jdk, securityDir],
            'ghost cleanup'    : [files(new File(haDir, 'GhostCleanup.java')), mqttAllowed, haDir],
            // The timers' schedules (M4-2) and the world telemetry (M4-7); the self-test below proves the rule bites on every run.
            'device.timer.core': [fileTree(new File(branchDir, 'src/main/java/art/rehra/mineqtt/device/timer/core')) { include '**/*.java' }, timerAllowed],
            'telemetry.core'   : [fileTree(new File(branchDir, 'src/main/java/art/rehra/mineqtt/telemetry/core')) { include '**/*.java' }, telemetryAllowed],
            'telemetry.core checks': [fileTree(new File(branchDir, 'src/brokerChecks/java/art/rehra/mineqtt/telemetry/core')) { include '**/*.java' }, telemetryAllowed],
            'clocks'          : [files(new File(utilDir, 'GameClock.java'), new File(utilDir, 'CronSchedule.java')), jdk, utilDir],
    ]
    // Synthetic sources each M4 core must refuse, and one it must accept: a scope that matches no file yet checks nothing,
    // so the rule itself is tested on every run.
    def selfTests = [
            'device.timer.core': timerAllowed,
            'telemetry.core'   : telemetryAllowed,
    ]
    def forbiddenSource = 'import net.minecraft.world.level.Level;\nclass Probe { net.minecraft.core.BlockPos pos; art.rehra.mineqtt.device.DeviceType type; }\n'
    def forbiddenNames = ['net.minecraft.world.level.Level', 'net.minecraft.core.BlockPos', 'art.rehra.mineqtt.device.DeviceType']
    def allowedSource = 'import com.google.gson.JsonObject;\nimport java.time.Instant;\nimport art.rehra.mineqtt.util.GameClock;\n' +
            'import art.rehra.mineqtt.util.CronSchedule;\nimport art.rehra.mineqtt.security.TokenBucket;\nclass Probe { /* net.minecraft.Ignored in a comment */ String s = "net.minecraft.Ignored"; }\n'
    def baseDir = branchDir
    scopes.each { name, scope -> inputs.files(scope[0]).withPropertyName(name.replaceAll(/\W/, '_')) }
    inputs.files(fileTree(securityDir) { include '*.java' }).withPropertyName('securityPackage')
    inputs.files(fileTree(haDir) { include '*.java' }).withPropertyName('haPackage')
    doLast {
        // Comments and string literals are blanked (keeping newlines) so only code matches and line numbers stay exact.
        def nonCode = ~/(?s)""".*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])+'|\/\/[^\n]*|\/\*.*?\*\//
        // A qualified name: two or more lowercase segments (the package), then a type or a wildcard. This catches
        // imports, static imports and fully qualified references alike, and lets an allowlist name a single class.
        // A field chain ending in a constant (a.b.CONST) also matches.
        def qualifiedName = ~/(?<![\w.])([a-z_][a-z0-9_]*(?:\.[a-z_][a-z0-9_]*)+)\.([A-Z][\w$]*|\*)/
        def violations = []
        def relative = { File source -> baseDir.toPath().relativize(source.toPath()) }
        scopes.each { name, scope ->
            def (sources, allowed, packageDir) = scope
            // The other classes of a single class's package need no import, so they are matched by their simple names.
            def siblingName = null
            if (packageDir != null) {
                def own = sources.files*.name
                sources.files.findAll { !it.isFile() }.each { violations << "${relative(it)}: missing, so ${name} checks nothing there" }
                def siblings = packageDir.listFiles().findAll { it.name.endsWith('.java') && !own.contains(it.name) }.collect { it.name - '.java' }
                if (!siblings.isEmpty()) siblingName = ~/(?<![\w.$])(${siblings.join('|')})(?![\w$])/
            }
            sources.files.findAll { it.isFile() }.sort().each { File source ->
                def code = source.getText('UTF-8').replaceAll(nonCode) { String literal -> literal.replaceAll(/[^\n]/, ' ') }
                def report = { int offset, String rule ->
                    def line = code.substring(0, offset).count('\n') + 1
                    violations << "${relative(source)}:${line} (${name} ${rule}): ${source.readLines('UTF-8')[line - 1].trim()}"
                }
                def matcher = qualifiedName.matcher(code)
                while (matcher.find()) {
                    def qualified = matcher.group(1) + '.' + matcher.group(2)
                    if (!allowed.any { qualified == it || qualified.startsWith(it + '.') }) report(matcher.start(), "may only use ${allowed.join(', ')}")
                }
                if (siblingName != null) {
                    def sibling = siblingName.matcher(code)
                    while (sibling.find()) report(sibling.start(), "may not use ${sibling.group(1)}, another class of its package")
                }
            }
        }
        selfTests.each { name, allowed ->
            def offending = { String source ->
                def code = source.replaceAll(nonCode) { String literal -> literal.replaceAll(/[^\n]/, ' ') }
                def found = []
                def matcher = qualifiedName.matcher(code)
                while (matcher.find()) {
                    def qualified = matcher.group(1) + '.' + matcher.group(2)
                    if (!allowed.any { qualified == it || qualified.startsWith(it + '.') }) found << qualified
                }
                found
            }
            def refused = offending(forbiddenSource)
            if (refused != forbiddenNames) violations << "self-test: ${name} must refuse ${forbiddenNames}, refused ${refused}"
            def accepted = offending(allowedSource)
            if (!accepted.isEmpty()) violations << "self-test: ${name} must accept the JDK, Gson, GameClock, CronSchedule and TokenBucket, refused ${accepted}"
        }
        if (!violations.isEmpty()) {
            throw new GradleException("A Minecraft-free core references something outside its allowlist:\n" + violations.join('\n'))
        }
    }
}

tasks.named('check') {
