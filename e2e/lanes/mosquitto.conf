# The lane broker: plain MQTT 3.1.1 and 5, anonymous. Reachable as mosquitto:1883 inside the lane network and on an
# ephemeral loopback port from the host (lane.sh ports <id>).
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
allow_anonymous true

listener 1883
protocol mqtt
