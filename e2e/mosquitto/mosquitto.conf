# Mosquitto 2 for the MineQTT end-to-end checklist. Anonymous access is fine for a local test broker only:
# a real deployment uses passwords and the ACL from the wiki (Broker Setup).
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
allow_anonymous true

# MQTT 3.1.1 and 5
listener 1883
protocol mqtt

# TLS (mqtts://localhost:8883, tls.caFile = e2e/certs/ca.crt)
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# WebSockets (ws://localhost:9001/mqtt; Mosquitto accepts any path)
listener 9001
protocol websockets

# Secure WebSockets (wss://localhost:9443/mqtt)
listener 9443
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
