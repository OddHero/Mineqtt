<script type="text/html" data-help-name="mineqtt-smart-lamp">
<p>A Smart Lamp, or any Home Assistant light. Input: ON, OFF, TOGGLE, true/false, a brightness 0-255, or an object with state, brightness, color ({r,g,b}, &quot;#rrggbb&quot; or a dye name), color_temp_kelvin, effect and transition. Output: ON/OFF, msg.state holds brightness and colour.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>light</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-signal-beacon">
<p>A Signal Beacon (its beam colour snaps to the 16 dyes). Input: like the smart lamp, a dye name such as &quot;light_blue&quot;, or an alarm state (disarmed, armed_away, triggered, ...) to show it as a colour; wire an alarm panel node into it. Output: ON/OFF, msg.state.dye.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>light</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-redstone-output">
<p>A Redstone Output, or a Home Assistant switch. Input: ON, OFF, TOGGLE, true/false, or a power level 0-15 (Minecraft only). Output: ON/OFF, msg.state.power holds the level.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>switch</code>, <code>input_boolean</code>, <code>light</code>, <code>fan</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-smart-plug">
<p>A Smart Plug, or any Home Assistant switch. Input: ON, OFF, TOGGLE or true/false. Output: ON/OFF.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>switch</code>, <code>input_boolean</code>, <code>light</code>, <code>fan</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-redstone-input">
<p>A Redstone Input (a redstone signal in the world), or a Home Assistant binary sensor. Events: one message per rising edge (&quot;pulse&quot;). State changes: true/false, msg.state.signal holds the level 0-15.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>binary_sensor</code>, <code>input_boolean</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it, <code>msg.event</code> / <code>msg.eventType</code> for events (pulse).</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-presence-sensor">
<p>A Presence Sensor, or a Home Assistant occupancy/motion sensor. Output: true while someone is there, msg.state.count holds how many.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>binary_sensor</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-climate-sensor">
<p>A Climate Sensor, or a Home Assistant sensor. Output: the chosen value as a number (Minecraft) or the sensor's state (Home Assistant); msg.state holds all readings.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>sensor</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-wall-switch">
<p>A Wall Switch, or a Home Assistant button, event entity (e.g. a Zigbee remote) or binary sensor. Output: one message per press of the chosen button and press type, TOGGLE by default; msg.button says which button. Input (Minecraft only): &quot;left&quot; or &quot;right&quot; presses that button as if a player had.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>event</code>, <code>binary_sensor</code>, <code>input_button</code>, <code>button</code>, <code>input_boolean</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it, <code>msg.event</code> / <code>msg.eventType</code> for events (press, double_press, hold).</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-display-panel">
<p>A Display Panel, or a Home Assistant text entity. Input: the text to show (up to 255 characters; a new line, or \n typed in a text field, starts a new line); an object may also set color (dye name), glow and size (Minecraft). Output: the message.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>text</code>, <code>input_text</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-timer">
<p>An Interval Timer, Daylight Timer, Alarm Clock or Cron Timer, or a Home Assistant event/button/timer. Events: one message each time it fires (TOGGLE by default). State changes: true/false (armed), msg.state.next_fire. Input (Minecraft): &quot;trigger&quot; fires it now, ON/OFF/TOGGLE arms or disarms it.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>event</code>, <code>input_button</code>, <code>button</code>, <code>timer</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it, <code>msg.event</code> / <code>msg.eventType</code> for events (fired).</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-block-observer">
<p>A Block Observer, or a Home Assistant sensor. State changes: the block id it watches (e.g. &quot;minecraft:stone&quot;), msg.state.properties holds its block state. Events: one message per change.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>sensor</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it, <code>msg.event</code> / <code>msg.eventType</code> for events (changed).</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-block-placer">
<p>A Block Placer (the server must enable it), or a Home Assistant button. Input: &quot;place&quot; or &quot;clear&quot;, a block id such as &quot;minecraft:white_wool&quot; (placed at once), or TOGGLE/ON/OFF (place/clear by its state). Output: true while its block is placed.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>button</code>, <code>input_button</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-container-observer">
<p>A Container Observer (a chest, barrel, ...), or a Home Assistant sensor. Output: the chosen value; msg.state.items maps item ids to counts.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>sensor</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-entity-observer">
<p>An Entity Observer (an entity in front of it), or a Home Assistant sensor. State changes: the chosen value. Events: one message whenever the entity in front changes.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>binary_sensor</code>, <code>sensor</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it, <code>msg.event</code> / <code>msg.eventType</code> for events (changed).</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-vibration-sensor">
<p>A Vibration Sensor (MineQTT 0.11), or a Home Assistant vibration/motion sensor. State changes: true while it senses vibrations. Events: one message per vibration group (step, door, block, ...).</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>binary_sensor</code>, <code>event</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it, <code>msg.event</code> / <code>msg.eventType</code> for events (step, projectile, item, entity, door, container, block, other).</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-speaker">
<p>A Speaker (MineQTT 0.11), or a Home Assistant siren. Input: ON, OFF, TOGGLE, a tone name (alarm, chime, doorbell, beep, bell) to play it, an object {state, tone, duration, volume_level}, or {announce: &quot;text&quot;} for a chat announcement (only if the server allows them). Output: ON/OFF.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>siren</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it.</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-smart-lock">
<p>A Smart Lock (MineQTT 0.11), or a Home Assistant lock. Input: LOCK/ON/true locks, UNLOCK/OFF/false unlocks, TOGGLE toggles. State changes: locked, unlocked, open or jammed. Events: an &quot;attempt&quot; when someone tries the locked door or chest.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>lock</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it, <code>msg.event</code> / <code>msg.eventType</code> for events (attempt).</dd></dl>
</script>
<script type="text/html" data-help-name="mineqtt-alarm-panel">
<p>An Alarm Panel (MineQTT 0.11), or a Home Assistant alarm panel. Input: arm_away, arm_home, disarm or trigger (panic), or {action, code}. Disarming needs the code: msg.code, or the code set here (kept in the node's credentials). State changes: disarmed, arming, armed_home, armed_away, pending or triggered; wire them into a signal beacon to show the state in the world. Events: arm, disarm, trigger, wrong_code.</p>
<p>Choose a Minecraft device of this type from your MineQTT world, or a compatible Home Assistant entity
(<code>alarm_control_panel</code>). Devices are listed from the broker's retained messages:
deploy a new broker configuration once before the list fills.</p>
<dl class="message-properties"><dt>Input</dt><dd>See above; <code>msg.payload</code> is the command.</dd><dt>Output</dt><dd><code>msg.payload</code> the main value or <code>TOGGLE</code> for a trigger, <code>msg.state</code> the whole state, <code>msg.device</code> which device sent it, <code>msg.event</code> / <code>msg.eventType</code> for events (arm, disarm, trigger, wrong_code).</dd></dl>
</script>
