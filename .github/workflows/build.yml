name: Build

# Builds both loaders for every Minecraft version (Stonecutter nodes, see settings.gradle) and runs every check on each
# push to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Minecraft up to 1.21.11 needs Java 21, 26.x needs Java 25. Gradle finds both through
      # org.gradle.java.installations.fromEnv instead of downloading them.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only builds of main write the shared Gradle cache; pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build every version and run the checks
        run: ./gradlew build collectJars --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: MineQTT-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
