name: Build

# Builds both loaders and runs every check on each push to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only builds of main write the shared Gradle cache; pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and run the checks
        run: ./gradlew build --console=plain

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: MineQTT-${{ github.sha }}
          path: |
            fabric/build/libs/MineQTT-fabric-*.jar
            neoforge/build/libs/MineQTT-neoforge-*.jar
            !**/*-raw.jar
            !**/*-sources.jar
          if-no-files-found: error
          retention-days: 14
