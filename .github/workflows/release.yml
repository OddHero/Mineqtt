name: Release

# Publishes the version in gradle.properties (mod_version) for Fabric and NeoForge on every Minecraft version the build
# covers (the folders under versions/):
#   - a GitHub release with all jars and the version's CHANGELOG.md section,
#   - one Modrinth version per loader and Minecraft version (project "mineqtt"), numbered <mod_version>+<minecraft>,
#     with the same changelog.
#
# Start it by pushing a tag that equals mod_version (for example 0.8.0, or v0.8.0), or by hand from the Actions tab
# ("Run workflow", which tags the selected commit). Every step can be re-run: an existing GitHub release gets its files
# replaced, and a jar that Modrinth already has is skipped.
#
# Needs the repository secret MODRINTH_TOKEN: a Modrinth personal access token with the "Create versions" scope.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      modrinth:
        description: Also publish to Modrinth
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_INSTALLATIONS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::gradle.properties has no mod_version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::Tag $tag does not match mod_version $version in gradle.properties"
              exit 1
            fi
          else
            tag="$version"
          fi
          {
            echo "VERSION=$version"
            echo "TAG=$tag"
          } >> "$GITHUB_ENV"

      # Minecraft up to 1.21.11 needs Java 21, 26.x needs Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build, run the checks and write the release notes
        run: ./gradlew build collectJars releaseNotes --console=plain $JAVA_INSTALLATIONS

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: MineQTT ${{ env.VERSION }}
          body_path: build/release-notes.md
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: build/libs/MineQTT-*-${{ env.VERSION }}+*.jar
          fail_on_unmatched_files: true

      - name: Modrinth
        if: github.event_name == 'push' || inputs.modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::The repository secret MODRINTH_TOKEN is not set"
            exit 1
          fi
          published=$(curl -fsS -A "OddHero/Mineqtt release workflow" "https://api.modrinth.com/v2/project/mineqtt/version")
          set --
          for minecraft in $(ls versions); do
            for loader in fabric neoforge; do
              number="$VERSION+$minecraft"
              existing=$(echo "$published" | jq --arg n "$number" --arg l "$loader" \
                '[.[] | select(.version_number == $n and (.loaders | index($l)))] | length')
              if [ "$existing" -gt 0 ]; then
                echo "Modrinth already has $number for $loader, skipping it."
              else
                set -- "$@" ":$loader:$minecraft:modrinth"
              fi
            done
          done
          if [ "$#" -gt 0 ]; then
            ./gradlew "$@" --console=plain $JAVA_INSTALLATIONS
          fi
