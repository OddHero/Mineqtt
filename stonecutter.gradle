plugins {
    id 'dev.kikugie.stonecutter'
    // Loaded once here so all version nodes share one copy of each plugin.
    id 'dev.architectury.loom' apply false
    id 'dev.architectury.loom-no-remap' apply false
    id 'architectury-plugin' apply false
    id 'com.gradleup.shadow' apply false
    id 'com.modrinth.minotaur' apply false
    id 'net.darkhax.curseforgegradle' apply false
}

// The version whose code is active in src/. The "Set active project to ..." tasks rewrite this line.
stonecutter.active '26.2'

stonecutter.parameters {
    // In code, `/*$ minecraft*/ "26.2";` becomes the node's Minecraft version.
    swaps.put('minecraft', "\"${current.version}\";")

    // Renames between versions, written as the active version (26.2) has them. Each one is undone exactly when the active
    // version switches back, so the other side's spelling must not occur in the 26.2 sources.
    def before = { String version -> stonecutter.eval(current.version, "<$version") }
    def from = { String version -> stonecutter.eval(current.version, ">=$version") }

    // 26.2 moved the vanilla entity and block entity types into EntityTypes and BlockEntityTypes.
    replacements.regex(before('26.2')) {
        replace('\\bEntityTypes\\.([A-Z][A-Z0-9_]*)\\b', 'EntityType.$1', '\\bEntityType\\.([A-Z][A-Z0-9_]*)\\b', 'EntityTypes.$1')
        replace('\\bBlockEntityTypes\\.([A-Z][A-Z0-9_]*)\\b', 'BlockEntityType.$1', '\\bBlockEntityType\\.([A-Z][A-Z0-9_]*)\\b', 'BlockEntityTypes.$1')
        replace('import net\\.minecraft\\.world\\.entity\\.EntityTypes;', 'import net.minecraft.world.entity.EntityType; // EntityTypes',
                'import net\\.minecraft\\.world\\.entity\\.EntityType; // EntityTypes', 'import net.minecraft.world.entity.EntityTypes;')
        replace('import net\\.minecraft\\.world\\.level\\.block\\.entity\\.BlockEntityTypes;', 'import net.minecraft.world.level.block.entity.BlockEntityType; // BlockEntityTypes',
                'import net\\.minecraft\\.world\\.level\\.block\\.entity\\.BlockEntityType; // BlockEntityTypes', 'import net.minecraft.world.level.block.entity.BlockEntityTypes;')
    }

    // 26.2 grouped the dyed blocks and items into colour collections: Blocks.WOOL.white() was Blocks.WHITE_WOOL.
    def colors = ['white', 'orange', 'magenta', 'lightBlue', 'yellow', 'lime', 'pink', 'gray', 'lightGray', 'cyan', 'purple', 'blue',
                  'brown', 'green', 'red', 'black']
    def collections = [WOOL: 'WOOL', STAINED_GLASS: 'STAINED_GLASS', STAINED_GLASS_PANE: 'STAINED_GLASS_PANE', CONCRETE: 'CONCRETE',
                       CONCRETE_POWDER: 'CONCRETE_POWDER', CARPET: 'CARPET', DYED_TERRACOTTA: 'TERRACOTTA', GLAZED_TERRACOTTA: 'GLAZED_TERRACOTTA',
                       BED: 'BED', BANNER: 'BANNER', DYE: 'DYE']
    replacements.regex(before('26.2')) {
        collections.each { collection, suffix ->
            colors.each { color ->
                def old = color.replaceAll(/([A-Z])/, '_$1').toUpperCase() + '_' + suffix
                replace("\\b(Blocks|Items)\\.${collection}\\.${color}\\(\\)", "\$1.${old}", "\\b(Blocks|Items)\\.${old}\\b", "\$1.${collection}.${color}()")
            }
        }
    }

    // 26.3 renamed the redstone wire and the advancement display's getters.
    replacements.string(from('26.3')) {
        replace('RedStoneWireBlock', 'RedstoneWireBlock')
        replace('DisplayInfo::shouldAnnounceChat', 'DisplayInfo::announceToChat')
        replace('DisplayInfo::isHidden', 'DisplayInfo::hidden')
    }
}

// One folder with the release jar of every loader and Minecraft version: build/libs/.
tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Builds the release jars of all loaders and Minecraft versions and copies them to build/libs.'

    subprojects.findAll { it.parent?.name in ['fabric', 'neoforge'] }.each { node ->
        // releaseJar is the shadow jar on unobfuscated versions and the remapped shadow jar on obfuscated ones.
        dependsOn "${node.path}:releaseJar"
        from(node.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-raw.jar', '*-sources.jar', '*-dev-shadow.jar'
        }
    }
    into layout.buildDirectory.dir('libs')
}

// Release notes of one version: the CHANGELOG.md section from its "## <version>" heading up to the next "## " heading.
// CHANGELOG.md is wrapped at 120 columns; GitHub releases would show every line break, so wrapped lines are joined:
// a line continues the one before unless it is blank, a heading or a new list item.
ext.changelogFor = { String v ->
    def lines = rootProject.file('CHANGELOG.md').readLines('UTF-8')
    def heading = ~/^## ${java.util.regex.Pattern.quote(v)}(\s.*)?$/
    def start = lines.findIndexOf { heading.matcher(it).matches() }
    if (start < 0) {
        throw new GradleException("CHANGELOG.md has no '## ${v}' section")
    }
    def end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
    def startsBlock = { String line -> line.isBlank() || line.startsWith('#') || line ==~ /^\s*([-*]|\d+\.)\s.*/ }
    def out = []
    lines.subList(start + 1, end < 0 ? lines.size() : end).each { line ->
        if (!startsBlock(line) && out && !out.last().isBlank() && !out.last().startsWith('#')) {
            out[-1] = out.last() + ' ' + line.trim()
        } else {
            out << line
        }
    }
    out.join('\n').trim()
}

// Modrinth version type from the version: 1.2.3-alpha.1 is an alpha, 1.2.3-beta.1 or -rc.1 a beta, the rest releases.
ext.modrinthVersionType = { String v ->
    v.contains('-alpha') ? 'alpha' : (v.contains('-beta') || v.contains('-rc')) ? 'beta' : 'release'
}

// Writes the release notes of mod_version to build/release-notes.md (the body of the GitHub release).
tasks.register('releaseNotes') {
    def out = layout.buildDirectory.file('release-notes.md')
    def notes = changelogFor(project.mod_version)
    inputs.property('notes', notes)
    outputs.file(out)
    doLast {
        out.get().asFile.setText(notes + '\n', 'UTF-8')
    }
}
